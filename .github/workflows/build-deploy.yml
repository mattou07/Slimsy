name: Build, package and deploy

env:
  AZURE_WEBAPP_PACKAGE_PATH: "./myapp"
  ARTIFACT_NAME: "Slimsy.Web-v"
  FRONTEND_ARTIFACT_NAME: "Slimsy.Frontend-v"
  DOTNET_VERSION: '8'                 # set this to the .NET Core version to use
  PATH_TO_CSPROJ: "src/Slimsy.TestSite"
  CSPROJ_NAME: "Slimsy.TestSite.csproj"
  GH_TOKEN: ${{ github.token }}

on:
  workflow_dispatch:

jobs:
  setup:
    name: Setup our build
    runs-on: ubuntu-latest
    outputs:
      semver: ${{ env.RELEASE_VERSION }}

    steps:
      - uses: actions/checkout@v4

      - name: Get Tag Version
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Echo Release Version
        run: |
          echo $RELEASE_VERSION
          echo ${{ env.RELEASE_VERSION }}
        

  build:
    runs-on: ubuntu-latest
    needs: setup
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet
        id: nuget-packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-cache-${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj*') }}
          restore-keys: |
            nuget-cache-${{ runner.os }}-nuget-

      - name: Build Test Site
        run: dotnet build ${{env.PATH_TO_CSPROJ}}/${{env.CSPROJ_NAME}} -c Release

      - name: Publish only no build
        run: dotnet publish ${{env.PATH_TO_CSPROJ}}/${{env.CSPROJ_NAME}} --no-build -c Release -o ${{env.PATH_TO_CSPROJ}}/myapp /p:EnvironmentName=Production
  
      - name: Zip artifact for deployment
        working-directory: ${{env.PATH_TO_CSPROJ}}/myapp
        run: zip ../myapp.zip ./ -r
      
      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}${{ needs.setup.outputs.semver }}
          path: ${{env.PATH_TO_CSPROJ}}/myapp.zip
          retention-days: 30

  deploy:
    runs-on: [ubuntu-latest]
    needs: [setup, build]
    environment:
      name: 'Demo'

    permissions:
      id-token: write

    steps:

      - name: Download Website artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}${{ needs.setup.outputs.semver }}

      - name: OIDC Login to Azure Cloud
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_WEB_NAME }}
          package: "./myapp.zip"
    
  deploy-backoffice:
    runs-on: [ubuntu-latest]
    needs: [setup, build]
    environment:
      name: 'Demo'

    permissions:
      id-token: write

    steps:

      - name: Download Website artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}${{ needs.setup.outputs.semver }}

      - name: OIDC Login to Azure Cloud
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }} 

      - name: Deploy to Azure Web App
        id: deploy-to-umbraco-webapp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_WEBAPP_UMBRACO_NAME }}
          package: "./myapp.zip"